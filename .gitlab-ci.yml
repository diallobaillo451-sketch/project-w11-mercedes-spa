# GitLab Pages : publie public/. Assets lourds EN BASE64 (public/, parts/), vérifiés par SHA-256.
# Le code (index.html, JS, CSS, sw.js) est compilé ICI depuis source/game (Vite) puis superposé à public/.
.assemble:
  image: node:22
  script:
    - |
      find public parts -type f | while IFS= read -r f; do
        tmp=$(mktemp)
        if base64 -d "$f" > "$tmp" 2>/dev/null; then mv "$tmp" "$f"; else rm -f "$tmp"; fi
      done
    - mkdir -p "$(dirname public/assets/spa/t04.bin)" && cat parts/assets__spa__t04.bin.part00 parts/assets__spa__t04.bin.part01 > public/assets/spa/t04.bin
    - mkdir -p "$(dirname public/assets/spa/t05.bin)" && cat parts/assets__spa__t05.bin.part00 parts/assets__spa__t05.bin.part01 > public/assets/spa/t05.bin
    - mkdir -p "$(dirname public/assets/spa/t05_lod.bin)" && cat parts/assets__spa__t05_lod.bin.part00 parts/assets__spa__t05_lod.bin.part01 > public/assets/spa/t05_lod.bin
    - mkdir -p "$(dirname public/assets/spa/tex/c5ff7d9bfd57bb78.ktx2)" && cat parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part00 parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part01 parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part02 > public/assets/spa/tex/c5ff7d9bfd57bb78.ktx2
    - mkdir -p "$(dirname public/assets/w11_lh2020_high_ktx2.glb)" && cat parts/assets__w11_lh2020_high_ktx2.glb.part00 parts/assets__w11_lh2020_high_ktx2.glb.part01 parts/assets__w11_lh2020_high_ktx2.glb.part02 parts/assets__w11_lh2020_high_ktx2.glb.part03 > public/assets/w11_lh2020_high_ktx2.glb
    - mkdir -p "$(dirname public/assets/spa_pits/garage_player.glb)" && cat parts/assets__spa_pits__garage_player.glb.part00 parts/assets__spa_pits__garage_player.glb.part01 parts/assets__spa_pits__garage_player.glb.part02 > public/assets/spa_pits/garage_player.glb
    - mkdir -p "$(dirname public/assets/barcelona/t06.bin)" && cat parts/assets__barcelona__t06.bin.part00 parts/assets__barcelona__t06.bin.part01 parts/assets__barcelona__t06.bin.part02 > public/assets/barcelona/t06.bin
    - mkdir -p "$(dirname public/assets/barcelona/t09.bin)" && cat parts/assets__barcelona__t09.bin.part00 parts/assets__barcelona__t09.bin.part01 > public/assets/barcelona/t09.bin
    - test "$(stat -c%s public/assets/barcelona/t06.bin)" -eq 10161108 && test "$(stat -c%s public/assets/barcelona/t09.bin)" -eq 5622744
    - sha256sum -c SHA256SUMS
    - cd source/game && npm ci && npx vite build && cd ../..
    - rm -f public/assets/index-*.js public/assets/index-*.css
    - cp -r source/game/dist/. public/
    - |
      monza() {
        M=shared/assets/monza_2020
        P=shared/assets/spa_pits
        git fetch --depth 1 origin newbot-shared || return 1
        git checkout FETCH_HEAD -- $M "$P/pits.json" "$P/garage_player.glb.part001" "$P/garage_player.glb.part002" "$P/garage_player.glb.part003" "$P/garage_player.glb.part004" "$P/textures" || return 1
        find $M -type f \( -name '*.bin' -o -name '*.ktx2' -o -name '*.webp' \) ! -path "$M/preview/*" | while read -r f; do base64 -d "$f" > "$f.dec" && mv "$f.dec" "$f" || exit 1; done || return 1
        for p in $(find $M -name '*.part001' ! -path "$M/preview/*"); do b="${p%.part001}"; : > "$b"; for q in "$b".part*; do base64 -d "$q" >> "$b" || return 1; done; rm -f "$b".part*; done
        b=$P/garage_player.glb; : > "$b"
        for q in "$b".part*; do base64 -d "$q" >> "$b" || return 1; done
        rm -f "$b".part*
        test "$(stat -c%s "$b")" -eq 11140772 || return 1
        printf '426dca21e567b2de58c692c3ec0d2282321b56b942f3834406f77871f1df0914  %s\n' "$b" | sha256sum -c - >/dev/null || return 1
        for f in "$P"/textures/team_*.ktx2; do base64 -d "$f" > "$f.dec" && mv "$f.dec" "$f" || return 1; done
        mkdir -p public/assets/monza public/track_monza public/assets/monza_pits/textures
        cp -r $M/scene/. public/assets/monza/ || return 1
        for f in surface.json surface.bin barriers.bin pitlane.json crowd.bin crowd.json grassmask.bin meta.json; do cp $M/track/$f public/track_monza/ || return 1; done
        cp $M/marshals.json public/track_monza/marshals.json || return 1
        cp "$b" public/assets/monza_pits/garage_player.glb || return 1
        cp "$P"/textures/team_*.ktx2 public/assets/monza_pits/textures/ || return 1
        node source/tools/circuit_pipeline/generate_monza_pits.mjs "$M/track" "$M/scene" "$P/pits.json" public/track_monza/pits.json || return 1
        test "$(stat -c%s public/track_monza/surface.bin)" -eq 4177492 && test "$(stat -c%s public/assets/monza/t01.bin)" -eq 5278344 && test "$(stat -c%s public/track_monza/barriers.bin)" -eq 1964848
        node source/game/tests/monza-pits.test.mjs || return 1
      }
      if monza; then echo 'MONZA OK'; du -sh public/assets/monza public/track_monza public/assets/monza_pits; else echo 'ATTENTION : Monza non assemblé'; [ -z "$MONZA_STRICT" ] || exit 1; fi
    - du -sh public

pages:
  extends: .assemble
  stage: deploy
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Branches : même assemblage, rien n'est publié.
assemble_check:
  extends: .assemble
  stage: test
  variables:
    MONZA_STRICT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

circuit_pipeline_unit:
  stage: test
  image: python:3.12
  script:
    - python -m unittest discover -s source/tools/circuit_pipeline -p 'test_*.py' -v
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

typecheck:
  stage: test
  image: node:22
  script:
    - cd source/game
    - npm ci
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
