# GitLab Pages : publie public/. Assets lourds EN BASE64 (public/, parts/), vérifiés par SHA-256.
# Le code (index.html, JS, CSS, sw.js) est compilé ICI depuis source/game (Vite) puis superposé à public/.
.assemble:
  image: node:22
  script:
    - |
      find public parts -type f | while IFS= read -r f; do
        tmp=$(mktemp)
        if base64 -d "$f" > "$tmp" 2>/dev/null; then mv "$tmp" "$f"; else rm -f "$tmp"; fi
      done
    - mkdir -p "$(dirname public/assets/spa/t04.bin)" && cat parts/assets__spa__t04.bin.part00 parts/assets__spa__t04.bin.part01 > public/assets/spa/t04.bin
    - mkdir -p "$(dirname public/assets/spa/t05.bin)" && cat parts/assets__spa__t05.bin.part00 parts/assets__spa__t05.bin.part01 > public/assets/spa/t05.bin
    - mkdir -p "$(dirname public/assets/spa/t05_lod.bin)" && cat parts/assets__spa__t05_lod.bin.part00 parts/assets__spa__t05_lod.bin.part01 > public/assets/spa/t05_lod.bin
    - mkdir -p "$(dirname public/assets/spa/tex/c5ff7d9bfd57bb78.ktx2)" && cat parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part00 parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part01 parts/assets__spa__tex__c5ff7d9bfd57bb78.ktx2.part02 > public/assets/spa/tex/c5ff7d9bfd57bb78.ktx2
    - mkdir -p "$(dirname public/assets/w11_lh2020_high_ktx2.glb)" && cat parts/assets__w11_lh2020_high_ktx2.glb.part00 parts/assets__w11_lh2020_high_ktx2.glb.part01 parts/assets__w11_lh2020_high_ktx2.glb.part02 parts/assets__w11_lh2020_high_ktx2.glb.part03 > public/assets/w11_lh2020_high_ktx2.glb
    - mkdir -p "$(dirname public/assets/spa_pits/garage_player.glb)" && cat parts/assets__spa_pits__garage_player.glb.part00 parts/assets__spa_pits__garage_player.glb.part01 parts/assets__spa_pits__garage_player.glb.part02 > public/assets/spa_pits/garage_player.glb
    - mkdir -p "$(dirname public/assets/barcelona/t06.bin)" && cat parts/assets__barcelona__t06.bin.part00 parts/assets__barcelona__t06.bin.part01 parts/assets__barcelona__t06.bin.part02 > public/assets/barcelona/t06.bin
    - mkdir -p "$(dirname public/assets/barcelona/t09.bin)" && cat parts/assets__barcelona__t09.bin.part00 parts/assets__barcelona__t09.bin.part01 > public/assets/barcelona/t09.bin
    - test "$(stat -c%s public/assets/barcelona/t06.bin)" -eq 10161108 && test "$(stat -c%s public/assets/barcelona/t09.bin)" -eq 5622744
    - sha256sum -c SHA256SUMS
    - if [ -d public_sepang/assets/sepang ]; then echo 'VITE_SEPANG=1' > source/game/.env.production.local; fi
    - |
      silverstone_fetch() {
        S=shared/silverstone
        P=
        for B in silverstone-pack silverstone-assets; do
          git fetch --depth 1 origin "$B" || continue
          P=$(git ls-tree -r --name-only FETCH_HEAD | grep 'silverstone_pack.*\.tar$' | tail -n 1)
          [ -n "$P" ] && break
        done
        [ -n "$P" ] || return 1
        mkdir -p "$S" && git show "FETCH_HEAD:$P" > "$S/silverstone_pack.tar" || return 1
        (cd "$S" && sha256sum -c silverstone_pack.sha256) || return 1
        rm -rf public_silverstone /tmp/silv && mkdir -p public_silverstone/assets/silverstone public_silverstone/track_silverstone /tmp/silv || return 1
        tar -xf "$S/silverstone_pack.tar" -C /tmp/silv || return 1
        cp -r /tmp/silv/scene/. public_silverstone/assets/silverstone/ || return 1
        for f in surface.json surface.bin meta.json; do cp "/tmp/silv/track/$f" public_silverstone/track_silverstone/ || return 1; done
        test "$(stat -c%s public_silverstone/track_silverstone/surface.bin)" -eq 4264132
      }
      if silverstone_fetch; then echo 'SILVERSTONE : paquet verifie'; echo 'VITE_SILVERSTONE=1' >> source/game/.env.production.local; else echo 'ATTENTION : Silverstone non assemble (paquet absent ou invalide)'; case "$CI_COMMIT_BRANCH" in *silverstone*) exit 1;; esac; fi
    - if [ -d public_marina/assets/marina ]; then echo 'VITE_MARINA=1' >> source/game/.env.production.local; fi
    - cd source/game && npm ci && npx vite build && cd ../..
    - rm -f public/assets/index-*.js public/assets/index-*.css
    - cp -r source/game/dist/. public/
    - |
      monza() {
        M=shared/assets/monza_2020
        git fetch --depth 1 origin newbot-shared || return 1
        git checkout FETCH_HEAD -- $M || return 1
        find $M -type f \( -name '*.bin' -o -name '*.ktx2' -o -name '*.webp' \) ! -path "$M/preview/*" | while read -r f; do base64 -d "$f" > "$f.dec" && mv "$f.dec" "$f" || exit 1; done || return 1
        for p in $(find $M -name '*.part001' ! -path "$M/preview/*"); do b="${p%.part001}"; : > "$b"; for q in "$b".part*; do base64 -d "$q" >> "$b" || return 1; done; rm -f "$b".part*; done
        mkdir -p public/assets/monza public/track_monza
        cp -r $M/scene/. public/assets/monza/ || return 1
        for f in surface.json surface.bin barriers.bin pitlane.json crowd.bin crowd.json grassmask.bin meta.json; do cp $M/track/$f public/track_monza/ || return 1; done
        cp $M/marshals.json public/track_monza/marshals.json || return 1
        test "$(stat -c%s public/track_monza/surface.bin)" -eq 4177492 && test "$(stat -c%s public/assets/monza/t01.bin)" -eq 5278344 && test "$(stat -c%s public/track_monza/barriers.bin)" -eq 1964848
      }
      if monza; then echo 'MONZA OK'; du -sh public/assets/monza public/track_monza; else echo 'ATTENTION : Monza non assemblé'; [ -z "$MONZA_STRICT" ] || exit 1; fi
    - |
      if [ -d public_sepang/assets/sepang ] && [ -d public_sepang/track_sepang ]; then
        mkdir -p public/assets/sepang public/track_sepang
        cp -r public_sepang/assets/sepang/. public/assets/sepang/ && cp -r public_sepang/track_sepang/. public/track_sepang/ && echo 'SEPANG OK' && du -sh public/assets/sepang public/track_sepang
      else
        echo 'Sepang non assemblé (GLB absent ou conversion en échec) : circuit indisponible'
      fi
    - |
      if [ -d public_silverstone/assets/silverstone ] && [ -d public_silverstone/track_silverstone ]; then
        if [ -f public/assets/monza/tiles.json ]; then
          rm -rf /tmp/silv_patch && cp -r public_silverstone/assets/silverstone /tmp/silv_patch \
            && node source/tools/circuit_pipeline/reuse_circuit_textures.mjs /tmp/silv_patch public/assets/monza \
            && rm -rf public_silverstone/assets/silverstone && mv /tmp/silv_patch public_silverstone/assets/silverstone \
            || echo 'Textures de Monza non reutilisees : Silverstone garde les siennes'
        fi
        mkdir -p public/assets/silverstone public/track_silverstone
        cp -r public_silverstone/assets/silverstone/. public/assets/silverstone/ && cp -r public_silverstone/track_silverstone/. public/track_silverstone/ && echo 'SILVERSTONE OK' && du -sh public/assets/silverstone public/track_silverstone
      else
        echo 'Silverstone non assemble : circuit indisponible'
      fi
    - |
      if [ -d public_marina/assets/marina ] && [ -d public_marina/track_marina ]; then
        mkdir -p public/assets/marina public/track_marina
        cp -r public_marina/assets/marina/. public/assets/marina/ && cp -r public_marina/track_marina/. public/track_marina/ && echo 'MARINA OK' && du -sh public/assets/marina public/track_marina
      else
        echo 'Marina Bay non assemblé (modèle absent de source/marina/ ou conversion en échec) : circuit indisponible'
      fi
    - du -sh public

# Sepang : conversion du GLB déposé dans source/sepang/ (surface physique + scène 3D). Sans GLB, seule la syntaxe des scripts est vérifiée.
sepang_build:
  stage: build
  image: python:3.12
  script:
    - python3 -m py_compile source/sepang/*.py
    - |
      G=$(find source/sepang -maxdepth 1 -name '*.glb' | head -n 1)
      if [ -z "$G" ]; then echo 'GLB Sepang absent de source/sepang/ : conversion ignorée'; exit 0; fi
      pip install --quiet --no-cache-dir numpy scipy opencv-python-headless pillow
      python3 source/sepang/build_sepang.py "$G" public_sepang
  artifacts:
    paths:
      - public_sepang
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - if: $CI_COMMIT_BRANCH

# Marina Bay (nuit) : conversion du modèle déposé dans source/marina/ (3 morceaux .glb.001 .glb.002 .glb.003, ou un seul .glb)
# en surface physique + scène 3D + ciel de nuit + lampadaires. Sans modèle, seule la syntaxe des scripts est vérifiée.
marina_build:
  stage: build
  image: python:3.12
  script:
    - python3 -m py_compile source/marina/*.py
    - |
      if ls source/marina/*.glb.0* > /dev/null 2>&1; then
        cat $(ls source/marina/*.glb.0* | sort) > /tmp/marina.glb
        G=/tmp/marina.glb
      else
        G=$(find source/marina -maxdepth 1 -name '*.glb' | head -n 1)
      fi
      if [ -z "$G" ]; then echo 'Modèle Marina Bay absent de source/marina/ : conversion ignorée'; exit 0; fi
      ls -l "$G"
      pip install --quiet --no-cache-dir numpy scipy opencv-python-headless pillow
      mkdir -p /tmp/hdr
      curl -fsSL --retry 3 --max-time 120 -o /tmp/hdr/moonless_golf_1k.hdr https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/equirectangular/moonless_golf_1k.hdr || rm -f /tmp/hdr/moonless_golf_1k.hdr
      HDR=
      if [ -f /tmp/hdr/moonless_golf_1k.hdr ] && echo '4f597078024bd81429431e872d466d8808653ad62a8bc8c61d8052af7466c3aa  /tmp/hdr/moonless_golf_1k.hdr' | sha256sum -c -; then HDR='--hdr /tmp/hdr/moonless_golf_1k.hdr'; else echo 'HDRI de nuit indisponible ou invalide : ciel procédural'; fi
      python3 source/marina/build_marina.py "$G" public_marina $HDR
      du -sh public_marina/assets/marina public_marina/track_marina
  artifacts:
    paths:
      - public_marina
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - if: $CI_COMMIT_BRANCH

pages:
  extends: .assemble
  stage: deploy
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Branches : même assemblage, rien n'est publié.
assemble_check:
  extends: .assemble
  stage: test
  variables:
    MONZA_STRICT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

circuit_pipeline_unit:
  stage: test
  image: python:3.12
  script:
    - python -m unittest discover -s source/tools/circuit_pipeline -p 'test_*.py' -v
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

typecheck:
  stage: test
  image: node:22
  script:
    - cd source/game
    - npm ci
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Silverstone : test navigateur du dépôt (Playwright + Chrome, rendu logiciel) après assemblage complet. Branches « silverstone » seulement, non bloquant.
silverstone_app_test:
  extends: .assemble
  stage: test
  allow_failure: true
  script:
    - !reference [.assemble, script]
    - |
      apt-get update -qq && apt-get install -y -qq wget ca-certificates > /dev/null
      wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      apt-get install -y -qq ./google-chrome-stable_current_amd64.deb > /dev/null
      (python3 -m http.server 5199 --directory public > /dev/null 2>&1 &)
      sleep 2
      cd source/game && CIRCUIT=silverstone node tests/app.mjs http://127.0.0.1:5199/
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - source/out/app/
  rules:
    - if: $CI_COMMIT_BRANCH =~ /silverstone/ && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
